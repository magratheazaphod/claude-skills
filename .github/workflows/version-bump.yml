# Backstop for the pre-commit hook, which a fresh clone doesn't have enabled.
name: Plugin version bump
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed plugins must bump their version
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch's first push has no "before" commit.
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then exit 0; fi
          python3 -I checks/version_bump.py "$base" "${{ github.sha }}"
